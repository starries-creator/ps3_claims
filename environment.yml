name: ps3
channels:
  - conda-forge
  - nodefaults
dependencies:
  # defaults
  - python>=3.8
  - pip
  - pre-commit
  - pytest>=6  # Adds --import-mode option
  - pytest-cov
  - setuptools-scm
  # data
  - pandas<3  # DALEX 1.8.0 requires pandas 1.x or 2.x.
  - numpy
  - pyarrow
  - dask-ml
  - ydata-profiling
  # interactive
  - ipykernel
  # plots
  - matplotlib
  # ml
  - glum
  - lightgbm
  - scikit-learn
  # PS4 model interpretation
  - pip:
      - dalex==1.8.0
